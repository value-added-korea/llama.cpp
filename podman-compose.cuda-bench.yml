# podman-compose.cuda-bench.yml
#
# Container service for benchmarking the official llama.cpp CUDA build.
# Used by run-cuda-nvidia-bench.sh but can also be used interactively:
#
#   podman compose -f podman-compose.cuda-bench.yml pull
#   podman compose -f podman-compose.cuda-bench.yml run --rm bench-cuda \
#       llama-bench -m /models/bartowski/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf \
#                   -ngl 99 -fa 0,1 -pg 512,128 -r 3 -o jsonl
#
# NVIDIA GPU access: CDI spec at /etc/cdi/nvidia.yaml (generated by nvidia-ctk)
# If you need to regenerate it:
#   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
#
# Container image tag: full-cuda-b<build_number>
# b9445 is the release tag in this repo; 4 later commits are CI/SYCL-only and
# were never published as a container image. The inference code is identical.
# Registry moved from ggerganov → ggml-org namespace.
# To use a different version, set LLAMA_IMAGE env var before running.

services:
  bench-cuda:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:full-cuda-b9445}
    volumes:
      # Mount models directory read-only; paths inside container: /models/bartowski/...
      - /mnt/512_ssd_internal/vai-llm-tei/llm-models:/models:ro
    devices:
      # NVIDIA CDI device — requires /etc/cdi/nvidia.yaml (nvidia-ctk 1.19.1)
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
    environment:
      - CUDA_VISIBLE_DEVICES=0
      # Suppress AOCC-related env vars that might bleed in from the host shell
      - ROCR_VISIBLE_DEVICES=
      - HIP_VISIBLE_DEVICES=
    # Override /app/tools.sh (the image default) with sleep so 'up -d' keeps
    # the container alive. The actual llama-bench binary is at /app/llama-bench.
    # Run bench commands against the live container with exec:
    #   podman exec llamacpp_bench-cuda_1 /app/llama-bench --list-devices
    #   podman exec llamacpp_bench-cuda_1 /app/llama-bench \
    #       -m /models/bartowski/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf \
    #       -ngl 99 -fa "0,1" -pg "512,128" -r 3 -o jsonl
    entrypoint: ["sleep", "infinity"]
